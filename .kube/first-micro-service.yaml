apiVersion: apps/v1
kind: Deployment
metadata:
  name: first-micro-service-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: first-micro-service-deploy
  template:
    metadata:
      labels:
        app: first-micro-service-deploy
    spec:
      containers:
      - name: first-micro-service-deploy
        image: myskillskit/first-microservice:3.0.0
        resources:
          limits:
            memory: "512Mi"
            cpu: "1000m"
        ports:
        - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: first-micro-service-deploy
spec:
  type: LoadBalancer
  selector:
    app: first-micro-service-deploy
  ports:
    - port: 8081
      targetPort: 8081
